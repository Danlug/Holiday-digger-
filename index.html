:root{
	color-scheme:dark;
	--ink:#150E09;--gold:#E8B32E;--gold-hi:#FFE066;--parch:#E8D8B0;--soil-warm:#B4854E;--void:#161A24;
	--panel:#241E2C;--rim:#A4835A;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0D0A07;overscroll-behavior:none}
body{
	position:fixed;inset:0;
	color:var(--parch);
	font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
	touch-action:none;
	-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;
	-webkit-tap-highlight-color:transparent;
	-webkit-text-size-adjust:100%;text-size-adjust:100%;
}
img{-webkit-user-drag:none;user-select:none;image-rendering:crisp-edges;image-rendering:pixelated}
noscript{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;background:#0D0A07;font-size:18px;line-height:1.4}

/* ---- пиксельный текст: клетка шрифта = --u */
.px{font-family:"RaskopkiPixel",ui-monospace,Menlo,Consolas,monospace;font-size:calc(var(--u)*10);line-height:calc(var(--u)*10);
	font-weight:normal;letter-spacing:0;text-transform:uppercase;white-space:nowrap;-webkit-font-smoothing:none;font-smooth:never;
	--ol:var(--u);
	text-shadow:var(--ol) 0 0 var(--ink),calc(-1*var(--ol)) 0 0 var(--ink),0 var(--ol) 0 var(--ink),0 calc(-1*var(--ol)) 0 var(--ink),
		var(--ol) var(--ol) 0 var(--ink),calc(-1*var(--ol)) var(--ol) 0 var(--ink),var(--ol) calc(-1*var(--ol)) 0 var(--ink),calc(-1*var(--ol)) calc(-1*var(--ol)) 0 var(--ink)}

/* ---- сцена: небо ступенями, сосны, трава, земля. Одна и та же — на экране загрузки и вокруг колонки на десктопе */
.scene{position:absolute;inset:0;overflow:hidden;
	--hz:calc(var(--stageh,100vh)*.56 - var(--y0,0px));
	background:linear-gradient(#3C86CC 0 14%,#4A94D6 14% 26%,#5BA3DF 26% 36%,#72B4E6 36% 44%,#8EC4EC 44% 50%,#B2D7F0 50% 56%,transparent 56%)
		0 calc(0px - var(--y0,0px))/100% var(--stageh,100vh) no-repeat}
.scene .cloud{position:absolute;left:0;animation:drift 110s linear infinite}
.scene .cloud.c1{top:9%;width:calc(44*var(--u));animation-duration:120s;animation-delay:-35s}
.scene .cloud.c2{top:21%;width:calc(30*var(--u));animation-duration:80s;animation-delay:-12s}

	background:linear-gradient(#7FA84A 0 var(--u),#4F7A34 var(--u) calc(2*var(--u)),#365423 calc(2*var(--u)) 100%)}

	background:url(data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAEU0lEQVR42s1av0tbURT+fDwcOqSBFpUMD4lPcXGocQgdSgQXOxQCbUFcSulUB6FDuqiDUKQu/QPawUWQLo6Ci05FikMhgxATCaGEYi1oKEInO5QT7ju5P997ag8EX/Leu/e7554f3znXvg8vi1dgUm+dd69np8cAADt7NZik2u5Evk/kMtrfASAMstg+aEV+D4MsmisbeDeYx8eFR1DhC4MsPB34MMjCRURg4nW5GEiv+XyiDK++kILn2HzVQPTAceM09iLEsel3mudiqIR8PsSvL5+k79iKp9PCdcrJSR0nJ3WpGZJJyYSw0t++hZnxK9M2pblA3ZjcV2zMzddNZgOcAHFH1D1L1+L4HLxqfq4APw1tiltebXecbVoGno/BAwp9927S7kWN0rUMvIv4fCtdAYVBFuVi0N0Fk926zGUTxr00tDpXvsTn9/e75kQfGxAyc3MxQS+tCDNYWo39rioBWpmQTEuui3r+9gzAa2X4i5sArX1AZnuui6jMTwEA1jcPAQCjIwPdTC7O4TKujtbQvVSikIr3JJFqu9ONUColK/OATVIShRgraX5nrxZhjEnzimoMKRuNI1tHOXz980ipwdGRga5JuYDnCrWOQuVi4GQKIjHjdYMseaUpfQsz41eqLbpJlipi4BrXKdP/H8DLLMDkh3PlS3kUqrfOncHPTo9FHDkpTzLdo8UNllbRZ6qJbTgKOahN3WxipBO5jLaG5vf8JLZKctw4TWRyIihXduql6YSuTYCk3KhcDG62HnABPJHL9ICX7Y6fdvSJW1/EJXOeK/jbDq/82o/TiaNK7DYWyJOasqBJGtevu6bu+oBL71NFsKgWSJIHdHlBtwjPlianye/5b/xetd1BZX4KlfkpY17wt45yyOdDALXYWlnfPOzpRKuyp6lvRM9mfp5p5+32hXiPUmzmiiYhy5bB5BOUnr4BACwv9mN5sV+rcZd2CQBMru33LI4nTO/Z+G8U+r9Fbhw3TntqWVnc5otXdSZkJadqbHp2abeJx4Vhcz0gI3Mqp9GZh+kwwzXsqnavJ4y6kDcVSJPf6HYyKX/y4oS2yvwUZqfHpH6hc1Cxa8errouhEu49fKWlFrLKzHjAwZuwFPP5tW5nbMaXHXgQodPV6MpMTFpKiyKb5MGd77j7Y99ZAT0nNJS8qMMms33ehbNllKbTShPYMMhGOn711jk8Gw3TxLSN65uHOG6cRrZVxt1lgMWPzJF1eGQHkT31ANcqH5jbYpITxjjCT009m8JCBXJ0ZEDJl2QVlaoELWQ8FDJeLDruybabZ06yPVN7ME5jgK4n1/atwYtYfNVLqrAVid8HrVS60Uu7TWB3WLvjKt/wq+1OBIRqQaoTe/68TUITK7o4FZzop55raieenrS/Qx1AE83g7HN0ZCAyvxOV0PmADLB4QEF+ZhsybROoH6dw39mrOYVP0W+2D1o975IJi4cizZUNAP/+a4WbsjjeXxIaow3eVUgLAAAAAElFTkSuQmCC) calc(0px - var(--x0,0px)) 0/calc(48*var(--u)) calc(48*var(--u));image-rendering:pixelated}
.scene .ground::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(21,14,9,.38),rgba(21,14,9,.62) 35%,rgba(21,14,9,.9))}
@keyframes drift{from{left:-50%}to{left:105%}}

/* ---- страница: сцена на весь экран + мягкая виньетка; в ней лежит колонка 224:480 */
#stage{position:fixed;top:0;left:0;right:0;bottom:0}
@supports (height:100dvh){#stage{bottom:auto;height:100dvh}}
#bg{--u:3px;--x0:0px;--y0:0px}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
	background:radial-gradient(ellipse 78% 72% at 50% 46%,rgba(0,0,0,0) 38%,rgba(8,5,3,.66) 100%)}
#avail{position:absolute;inset:0;display:flex;align-items:stretch;justify-content:stretch;
	padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#slot{flex:1 1 auto;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;flex:none;width:224px;height:480px;overflow:hidden;background:#0B0907;--u:3px}
#frame.col{box-shadow:0 14px 50px rgba(0,0,0,.55),0 2px 10px rgba(0,0,0,.45)}
#canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;outline:none;touch-action:none;
	image-rendering:crisp-edges;image-rendering:pixelated}

/* ---- экран загрузки */
#splash{position:absolute;inset:0;overflow:hidden;transition:opacity .6s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .logo{position:absolute;left:50%;top:calc(var(--hz) - 116*var(--u));width:calc(96*var(--u));transform:translateX(-50%)}
#splash .logo img{display:block;width:100%;height:auto;animation:bob 2.4s steps(1,end) infinite}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(calc(var(--u)*-1))}}
.grp{position:absolute;left:0;right:0;top:calc(var(--hz) + 16*var(--u));display:none;flex-direction:column;align-items:center;text-align:center}
#splash[data-mode=loading] .g-load,#splash[data-mode=starting] .g-load{display:flex}
#splash[data-mode=ready] .g-tap{display:flex;animation:fadein .5s ease both;cursor:pointer}
#splash[data-mode=fail] .g-fail{display:flex;top:calc(var(--hz) - 30*var(--u))}
#splash[data-mode=ready]{cursor:pointer}
@keyframes fadein{from{opacity:0}to{opacity:1}}

.lbl{color:var(--gold-hi);margin-bottom:calc(4*var(--u))}
.bar{padding:calc(2*var(--u));background:var(--ink);box-shadow:inset 0 0 0 var(--u) #5A4630}
.well{position:relative;width:calc(100*var(--u));height:calc(7*var(--u));background:var(--void);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;width:calc(var(--n,0)*5*var(--u));
	background:linear-gradient(#FFF1A8 0 var(--u),#E8B32E var(--u) calc(5*var(--u)),#C2703A calc(5*var(--u)) 100%)}
.cells{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(4*var(--u)),var(--void) calc(4*var(--u)) calc(5*var(--u)))}
.blink{position:absolute;top:0;bottom:0;left:calc(var(--n,0)*5*var(--u));width:calc(4*var(--u));background:rgba(255,224,102,.4);animation:blink .8s steps(1,end) infinite}
.indet .fill{width:calc(20*var(--u));animation:march 1.4s steps(20,end) infinite}
.indet .blink{display:none}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes march{from{left:calc(-20*var(--u))}to{left:calc(100*var(--u))}}
#splash[data-mode=starting] .blink,#splash[data-mode=starting] .pct{display:none}
.pct{margin-top:calc(5*var(--u));font-size:calc(var(--u)*20);line-height:calc(var(--u)*20);color:var(--parch);--ol:calc(2*var(--u))}
.pct .sign{color:var(--gold)}

.hand{position:relative;width:calc(36*var(--u));height:calc(38*var(--u))}
.hand img{position:absolute;left:0;top:0;width:100%;animation:tapdown 1.5s steps(1,end) infinite}
.hand i{position:absolute;left:47%;top:calc(3*var(--u));width:calc(18*var(--u));height:calc(18*var(--u));margin:calc(-9*var(--u)) 0 0 calc(-9*var(--u));
	border:var(--u) solid rgba(255,243,176,.95);border-radius:50%;opacity:0;animation:ripple 1.5s steps(6,end) infinite;animation-delay:.3s}
.hand i.r2{animation-delay:.55s}
@keyframes tapdown{0%{transform:translateY(0)}20%{transform:translateY(calc(3*var(--u)))}40%{transform:translateY(0)}}
@keyframes ripple{0%{opacity:.95;transform:scale(.25)}100%{opacity:0;transform:scale(1.7)}}
.prompt{margin-top:calc(6*var(--u));color:var(--parch);animation:pulse 1.6s steps(1,end) infinite}
@keyframes pulse{0%{opacity:1}60%{opacity:.55}}

.panel{width:min(calc(104*var(--u)),90%);padding:calc(4*var(--u));background:var(--panel);box-shadow:0 0 0 calc(2*var(--u)) var(--gold),0 0 0 calc(3*var(--u)) var(--ink),0 calc(6*var(--u)) 0 calc(3*var(--u)) rgba(0,0,0,.35)}
.panel .ftitle{color:var(--gold-hi);white-space:normal}
.panel p{margin:calc(3*var(--u)) 0 0;font-size:max(14px,calc(var(--u)*4.4));line-height:1.4;color:var(--parch)}
.panel p.detail{font-size:max(11px,calc(var(--u)*3.2));color:#8D7C66;word-break:break-word;font-family:ui-monospace,Menlo,Consolas,monospace}
.panel p.detail:empty{display:none}
.btn{appearance:none;-webkit-appearance:none;border:0;border-radius:0;margin:calc(6*var(--u)) 0 calc(2*var(--u));padding:calc(3*var(--u)) calc(5*var(--u));cursor:pointer;
	color:#3E2A1A;text-shadow:none;touch-action:manipulation;
	background:linear-gradient(#FFF1A8 0 var(--u),#E8B32E var(--u) calc(100% - 2*var(--u)),#C2703A calc(100% - 2*var(--u)) 100%);
	box-shadow:0 0 0 var(--u) var(--ink),0 calc(2*var(--u)) 0 var(--u) var(--ink)}
.btn:active{transform:translateY(var(--u))}
.btn[hidden]{display:none}

<script>
/* Ядро оболочки: раскладка, защита от жестов браузера, разблокировка звука, окно ошибки.
   Стоит ДО index.js, чтобы экран загрузки был размерён сразу, а не после 300 КБ скрипта движка. */
(function () {
	'use strict';
	var $ = function (id) { return document.getElementById(id); };
	var frame = $('frame'), canvas = $('canvas'), slot = $('slot'), splash = $('splash'), bg = $('bg'), rotate = $('rotate'), stage = $('stage');
	var root = document.documentElement;
	var shell = window.RaskopkiShell = { phase: 'boot' };

	function setPhase(p) { shell.phase = p; root.setAttribute('data-phase', p); }
	function setMode(m) { splash.setAttribute('data-mode', m); }
	setPhase('boot');

	// ---------- раскладка
	// Телефон: игра заполняет экран (Godot растягивает вьюпорт по expand, как и раньше).
	// Планшет и десктоп: колонка ровно 224:480 с целым множителем пикселей, пока он не съедает больше пятой части экрана.
	var BASE_W = 224, BASE_H = 480;
	function isPhone() {
		return window.matchMedia('(pointer: coarse)').matches && Math.min(window.innerWidth, window.innerHeight) <= 640;
	}
	function layout() {
		var r = slot.getBoundingClientRect();
		var aw = Math.max(1, r.width), ah = Math.max(1, r.height);
		var dpr = Math.min(window.devicePixelRatio || 1, 3);
		var phone = isPhone(), w, h;
		if (phone) {
			w = aw; h = ah;
			var a = w / h;
			if (a > 0.62) { w = h * 0.62; } else if (a < 0.40) { h = w / 0.40; }
		} else {
			var fit = Math.min(aw * dpr / BASE_W, ah * dpr / BASE_H);
			var k = fit;
			if (fit >= 1) {
				k = Math.floor(fit);
				if (fit / k > 1.25) { k = fit; }
			}
			w = BASE_W * k / dpr; h = BASE_H * k / dpr;
		}
		var cw = Math.max(1, Math.round(w * dpr)), ch = Math.max(1, Math.round(h * dpr));
		frame.style.width = (cw / dpr) + 'px';
		frame.style.height = (ch / dpr) + 'px';
		frame.classList.toggle('col', !phone);
		// Godot при canvasResizePolicy=0 берёт размер из canvas.width/height; трогаем, только когда он правда изменился.
		if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
		var U = Math.max(1, Math.floor(Math.min(cw * 0.9 / 104, ch * 0.30 / 68)));
		frame.style.setProperty('--u', (U / dpr) + 'px');
		// Фон вокруг колонки — та же сцена в том же масштабе и с той же линией горизонта: колонка выглядит окном в неё.
		var fr = frame.getBoundingClientRect(), st = stage.getBoundingClientRect();
		bg.style.setProperty('--u', (U / dpr) + 'px');
		root.style.setProperty('--stageh', st.height + 'px');
		root.style.setProperty('--y0', (fr.top - st.top) + 'px');
		root.style.setProperty('--x0', (fr.left - st.left) + 'px');
		var Ur = Math.max(1, Math.floor(Math.min(window.innerWidth, window.innerHeight) * dpr / 80));
		rotate.style.setProperty('--u', (Ur / dpr) + 'px');
	}
	shell.layout = layout;
	layout();
	window.addEventListener('resize', layout);
	window.addEventListener('orientationchange', function () { setTimeout(layout, 120); setTimeout(layout, 400); });
	if (window.visualViewport) { window.visualViewport.addEventListener('resize', layout); }
	document.addEventListener('fullscreenchange', layout);

	// ---------- жесты браузера: щипок, двойной тап, оттяжка страницы, меню и выделение по долгому нажатию
	// Долгое нажатие в игре показывает подсказки — браузер не должен его перехватывать.
	['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
		document.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
	});
	document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
	['contextmenu', 'selectstart', 'dragstart'].forEach(function (t) {
		document.addEventListener(t, function (e) { e.preventDefault(); });
	});
	window.addEventListener('wheel', function (e) { if (e.ctrlKey) { e.preventDefault(); } }, { passive: false });

	// ---------- звук: контекст, созданный в жесте, отдаём движку; остальные будим на каждом жесте
	var NativeAC = window.AudioContext || window.webkitAudioContext;
	var contexts = [], spare = null;
	if (NativeAC) {
		var Wrapped = function (opts) {
			var c;
			if (spare) { c = spare; spare = null; } else { c = new NativeAC(opts); }
			contexts.push(c);
			return c;
		};
		Wrapped.prototype = NativeAC.prototype;
		Object.setPrototypeOf(Wrapped, NativeAC);
		window.AudioContext = Wrapped;
		window.webkitAudioContext = Wrapped;
	}
	function resumeAudio() {
		contexts.forEach(function (c) {
			if (c.state !== 'running' && c.state !== 'closed') { c.resume().catch(function () {}); }
		});
	}
	shell.unlockAudio = function () {
		if (!NativeAC) { return; }
		try {
			spare = new NativeAC({ latencyHint: 'interactive' });
			spare.resume().catch(function () {});
			var src = spare.createBufferSource();
			src.buffer = spare.createBuffer(1, 1, 22050);
			src.connect(spare.destination);
			src.start(0);
		} catch (e) { spare = null; }
	};
	shell.audioStates = function () { return contexts.map(function (c) { return c.state; }); };
	['pointerdown', 'pointerup', 'touchend', 'click', 'keydown'].forEach(function (t) {
		window.addEventListener(t, resumeAudio, { capture: true, passive: true });
	});
	document.addEventListener('visibilitychange', function () { if (!document.hidden) { resumeAudio(); } });

	// ---------- полноэкранный режим: только там, где есть смысл и где браузер умеет (iPhone Safari — тихо пропускаем)
	shell.goFullscreen = function () {
		try {
			if (!window.matchMedia('(pointer: coarse)').matches) { return; }
			if (window.matchMedia('(display-mode: standalone)').matches || window.matchMedia('(display-mode: fullscreen)').matches) { return; }
			var el = document.documentElement;
			var req = el.requestFullscreen || el.webkitRequestFullscreen;
			if (!req) { return; }
			var p = req.call(el, { navigationUI: 'hide' });
			if (p && p.then) {
				p.then(function () {
					try { screen.orientation.lock('portrait').catch(function () {}); } catch (e) {}
				}, function () {});
			}
		} catch (e) { /* не вышло — играем в окне */ }
	};

	// ---------- окно ошибки
	var MESSAGES = {
		webgl: ['Нет графики', 'Браузер не даёт запустить WebGL 2. Включите аппаратное ускорение в настройках браузера или откройте игру в свежем Chrome, Firefox или Safari.', false],
		wasm: ['Старый браузер', 'Браузер не поддерживает WebAssembly. Обновите его или откройте игру в другом браузере.', false],
		https: ['Нет доступа', 'Игра запускается только по защищённому адресу (https). Откройте её по ссылке, которая начинается с https://', false],
		features: ['Не запустится', 'Этому браузеру не хватает возможностей, нужных игре. Попробуйте свежий Chrome, Firefox или Safari.', false],
		load: ['Не загрузилось', 'Не получилось скачать игру. Проверьте интернет и попробуйте ещё раз.', true],
		crash: ['Сбой', 'Игра остановилась. Сохранения лежат в браузере и не пропадут — перезагрузите страницу.', true],
		gl: ['Сбой графики', 'Видеопамять закончилась или экран был заблокирован. Перезагрузите игру.', true],
		exit: ['Игра закрыта', 'Игра завершилась. Нажмите «Перезагрузить», чтобы начать снова.', true]
	};
	shell.fail = function (kind, detail) {
		if (shell.phase === 'fail') { return; }
		var m = MESSAGES[kind] || MESSAGES.crash;
		setPhase('fail');
		$('failTitle').textContent = m[0];
		$('failText').textContent = m[1];
		$('failDetail').textContent = detail ? String(detail).slice(0, 280) : '';
		$('reload').hidden = !m[2];
		splash.classList.remove('out');
		splash.style.display = '';
		setMode('fail');
		layout();
		if (window.console) { console.error('[shell] ' + kind + (detail ? ': ' + detail : '')); }
	};
	$('reload').addEventListener('click', function () { window.location.reload(); });
	shell.setPhase = setPhase;
	shell.setMode = setMode;
}());
</script>

		<script>
// Сброс кэша: у экспорта Godot постоянные имена файлов, и браузер отдаёт
// прошлую сборку из кэша. Адреса получают ?v=<метка>, и старый кэш до них
// не дотягивается. Подмена стоит ДО загрузки index.js: движок просит wasm,
// пак и ворклеты сам.
(function () {
	const V = "20261026-2135";
	// Свежая ли сама страница: GitHub Pages отдаёт index.html с кэшем до 10 минут,
	// и Chrome показывает прошлую сборку. version.json берётся мимо кэша; если там
	// метка новее — перезагрузка на адрес с ?b=<новая метка>, которого в кэше нет.
	// Второй раз на тот же ?b= не уходим (защита от петли, если раздача отстаёт).
	try {
		window.fetch("version.json?t=" + Date.now(), { cache: "no-store" })
			.then(function (r) { return r.ok ? r.json() : null; })
			.then(function (j) {
				if (!j || !j.build || j.build === V) { return; }
				const u = new URL(location.href);
				if (u.searchParams.get("b") === j.build) { return; }
				u.searchParams.set("b", j.build);
				location.replace(u.toString());
			})
			.catch(function () { /* нет файла или офлайн — играем тем, что есть */ });
	} catch (e) { /* старый браузер без fetch/URL */ }
	const TOUCH = /index(\.[a-z.]+)?\.(js|wasm|pck)(\?|$)/;
	function bust(url) {
		if (typeof url !== "string" || !TOUCH.test(url) || url.indexOf("v=" + V) !== -1) {
			return url;
		}
		return url + (url.indexOf("?") === -1 ? "?" : "&") + "v=" + V;
	}
	const _fetch = window.fetch;
	window.fetch = function (input, init) {
		try {
			if (typeof input === "string") {
				input = bust(input);
			} else if (input && typeof input.url === "string") {
				const next = bust(input.url);
				if (next !== input.url) {
					input = new Request(next, input);
				}
			}
		} catch (e) { /* адрес не наш — пусть идёт как есть */ }
		return _fetch.call(this, input, init);
	};
	if (window.AudioWorklet && AudioWorklet.prototype.addModule) {
		const _add = AudioWorklet.prototype.addModule;
		AudioWorklet.prototype.addModule = function (url, options) {
			return _add.call(this, bust(url), options);
		};
	}
}());

	var $ = function (id) { return document.getElementById(id); };
	var canvas = $('canvas'), splash = $('splash');
	var GODOT_CONFIG = {"args":[],"canvasResizePolicy":0,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":20423520,"index.wasm":43682606},"focusCanvas":true,"gdextensionLibs":[]};
	var GODOT_THREADS_ENABLED = false;

	// ---------- проверка возможностей браузера
	if (typeof WebAssembly !== 'object') { shell.fail('wasm'); return; }
	if (typeof Engine === 'undefined') { shell.fail('load', 'index.js'); return; }
	var missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });
	if (missing.length) {
		var text = missing.join(' | ');
		shell.fail(/WebGL2/.test(text) ? 'webgl' : /Secure Context/.test(text) ? 'https' : 'features', text);
		return;
	}

	// ---------- индикатор: число и ячейки следуют за реальным прогрессом, но догоняют плавно
	var CELLS = 20, MIN_SPLASH_MS = 700;
	var t0 = performance.now();
	var target = 0, shown = 0, loaded = false, indeterminate = false, mb = 0;
	var well = $('well'), pct = $('pct'), bar = $('bar'), pctSign = $('pctSign');
	function onProgress(current, total) {
		if (total > 0 && current >= 0) {
			target = Math.min(0.99, current / total);
			if (indeterminate) { indeterminate = false; bar.classList.remove('indet'); pctSign.textContent = '%'; }
		} else {
			indeterminate = true;
			mb = current / 1048576;
			bar.classList.add('indet');
			pctSign.textContent = ' МБ';
		}
	}
	function paint() {
		if (shell.phase !== 'loading') { return; }
		var goal = loaded ? 1 : target;
		shown += Math.max(0.004, (goal - shown) * 0.2) * (goal > shown ? 1 : 0);
		if (shown > goal) { shown = goal; }
		var p = Math.floor(shown * 100 + 1e-6);
		pct.textContent = indeterminate ? mb.toFixed(1) : String(p);
		bar.setAttribute('aria-valuenow', String(p));
		well.style.setProperty('--n', String(Math.min(CELLS, Math.floor(shown * CELLS + 1e-6))));
		if (loaded && shown >= 1 && performance.now() - t0 >= MIN_SPLASH_MS) { enterReady(); return; }
		requestAnimationFrame(paint);
	}
	function enterReady() {
		shell.setPhase('ready');
		shell.setMode('ready');
	}

	// ---------- загрузка движка и пака до жеста; старт движка — после него
	var exe = GODOT_CONFIG.executable;
	var pack = GODOT_CONFIG.mainPack || (exe + '.pck');
	var engine = new Engine(Object.assign({}, GODOT_CONFIG, {
		canvas: canvas,
		canvasResizePolicy: 0, // размером холста управляет оболочка (колонка 224:480), движок его только читает
		onProgress: onProgress,
		onExit: function () { if (shell.phase === 'running' || shell.phase === 'starting') { shell.fail('exit'); } }
	}));
	shell.setPhase('loading');
	shell.layout();
	requestAnimationFrame(paint);
	Promise.all([engine.init(exe), engine.preloadFile(pack, pack)]).then(function () {
		loaded = true;
	}, function (err) {
		shell.fail('load', err && err.message ? err.message : err);
	});
	// Если качалось всё, а движок так и не поднялся — не висеть на 100% вечно. Отсчёт — от конца
	// скачивания, а не от открытия страницы: на мобильной сети без кэша (инкогнито) одно скачивание
	// идёт дольше 90 с, и прежний таймер ронял игру на 99%, пока движок ещё собирался.
	var downloadedAt = 0;
	var watchdog = setInterval(function () {
		if (shell.phase !== 'loading') { clearInterval(watchdog); return; }
		if (shown < 0.98 || loaded) { return; }
		if (!downloadedAt) { downloadedAt = performance.now(); $('loadLabel').textContent = 'Подготовка'; return; }
		if (performance.now() - downloadedAt > 120000) { clearInterval(watchdog); shell.fail('load', 'engine init timeout'); }
	}, 2000);

	// ---------- жест: звук, полный экран, старт
	function begin() {
		if (shell.phase !== 'ready') { return; }
		shell.setPhase('starting');
		shell.unlockAudio();
		shell.goFullscreen();
		$('loadLabel').textContent = 'Запуск';
		shell.setMode('starting');
		shell.layout();
		// два кадра на то, чтобы «Запуск» успел нарисоваться: engine.start() синхронно грузит главную сцену и держит поток
		requestAnimationFrame(function () { requestAnimationFrame(function () {
			try {
				engine.start({ args: ['--main-pack', pack].concat(GODOT_CONFIG.args || []) }).then(started, function (e) {
					shell.fail('crash', e && e.message ? e.message : e);
				});
			} catch (e) { shell.fail('crash', e && e.message ? e.message : e); }
		}); });
	}
	splash.addEventListener('click', begin);
	window.addEventListener('keydown', function (e) { if ((e.key === 'Enter' || e.key === ' ') && shell.phase === 'ready') { e.preventDefault(); begin(); } });

	function started() {
		if (shell.phase === 'fail') { return; }
		shell.setPhase('running');
		var frames = 0, t = performance.now();
		(function wait() {
			if (shell.phase !== 'running') { return; }
			if (++frames >= 4 && performance.now() - t > 300) {
				splash.classList.add('out');
				setTimeout(function () { if (shell.phase === 'running') { splash.style.display = 'none'; } }, 750);
				try { canvas.focus(); } catch (e) {}
			} else { requestAnimationFrame(wait); }
		}());
	}

	// ---------- падения: исключения движка, потеря WebGL-контекста
	// Пока идёт загрузка, фатально любое необработанное: Engine.init при сбое скачивания wasm не отклоняет свой промис,
	// и без этого страница вечно стояла бы на проценте.
	function crashLike(msg) { return /RuntimeError|abort|unreachable|out of bounds|memory|wasm|WebAssembly/i.test(String(msg || '')); }
	function onFatal(msg) {
		if (shell.phase === 'loading') { shell.fail('load', msg); } else if (crashLike(msg)) { shell.fail('crash', msg); }
	}
	window.addEventListener('error', function (e) { onFatal(e.message || (e.error && e.error.message)); });
	window.addEventListener('unhandledrejection', function (e) { onFatal(e.reason && e.reason.message ? e.reason.message : e.reason); });
	// Слушатель стоит раньше, чем у движка, и гасит его alert().
	canvas.addEventListener('webglcontextlost', function (e) {
		e.preventDefault();
		e.stopImmediatePropagation();
		shell.fail('gl');
	}, false);
}());
</script>
