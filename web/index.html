<title>Раскопки на каникулах</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Manrope:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{
  --soil:#16120E;
  --edge:#3E3125;
  --bone:#EADDC6;
  --muted:#9D8B73;
  --gold:#E0A93B;
  --rust:#B85A52;
  --moss:#8FA35C;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--soil);
  color:var(--bone);
  font-family:"Manrope",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}
#app{
  height:100%;
  display:flex;
  flex-direction:column;
  max-width:520px;
  margin:0 auto;
  padding-inline:10px;
  padding-block:8px;
  gap:8px;
}

#stage{
  flex:1 1 auto;
  min-height:0;
  position:relative;
  border:1px solid var(--edge);
  background:#0B0907;
  overflow:hidden;
}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated}

.gauges{
  position:absolute;
  top:8px; left:8px;
  display:flex;flex-direction:column;gap:4px;
  pointer-events:none;
}
.gauge{display:flex;align-items:center;gap:5px}
.gauge .ico{width:13px;height:13px;image-rendering:pixelated;flex:0 0 auto}
.track{
  width:72px;height:8px;
  background:#0B0907C0;
  border:1px solid #00000090;
  box-shadow:0 0 0 1px #FFFFFF14;
  overflow:hidden;
}
.fill{height:100%;width:100%;transition:width .25s linear}
.fill.hp{background:var(--rust)}
.fill.food{background:#C4706A}
.fill.rest{background:#6E93A8}

.purse{
  position:absolute;
  top:8px;right:8px;
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;
  pointer-events:none;
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:12px;font-variant-numeric:tabular-nums;
  text-shadow:0 1px 2px #000A;
}
.purse .row{display:flex;align-items:center;gap:5px}
.purse img{width:14px;height:14px;image-rendering:pixelated;flex:0 0 auto}
.purse .coins{color:var(--gold);font-weight:600}
.purse .dollars{color:#7FB86B;font-weight:600}
.purse .load{color:var(--moss)}
.purse .load.over{color:var(--rust)}

.depth{
  position:absolute;
  right:0;
  transform:translateY(-50%);
  display:none;align-items:center;gap:5px;
  padding:3px 7px 3px 9px;
  background:#120E0BD8;
  border:1px solid var(--edge);border-right:none;
  pointer-events:none;
}
.depth.on{display:flex}
.depth .n{
  font-family:"IBM Plex Mono",ui-monospace,monospace;
  font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1;
}
.depth .u{
  font-family:"Pixelify Sans","Manrope",sans-serif;
  font-size:9px;color:var(--muted);letter-spacing:.06em;
}

#toast{
  position:absolute;
  left:8px;right:8px;bottom:8px;
  background:#120E0BEE;
  border:1px solid var(--edge);border-left:3px solid var(--gold);
  padding:8px 10px;font-size:13px;line-height:1.35;
  opacity:0;transform:translateY(6px);
  transition:opacity .25s,transform .25s;
  pointer-events:none;
}
#toast.show{opacity:1;transform:none}
#toast b{color:var(--gold);font-weight:800}

.strip{flex:0 0 auto;display:flex;align-items:center;gap:8px}
.tool{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.tool img{width:20px;height:20px;image-rendering:pixelated;flex:0 0 auto}
.tool span{
  font-family:"Pixelify Sans","Manrope",sans-serif;
  font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.gear{display:flex;align-items:center;gap:5px;flex:0 0 auto}
.gear img{width:19px;height:19px;image-rendering:pixelated;opacity:.22;transition:opacity .3s}
.chip{
  font-family:"Pixelify Sans","Manrope",sans-serif;font-size:11px;
  color:var(--muted);background:none;
  border:1px solid var(--edge);padding:5px 9px;cursor:pointer;white-space:nowrap;
}
.chip[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.controls{
  flex:0 0 auto;
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
  height:132px;
}
#stick{
  position:relative;
  width:124px;height:124px;flex:0 0 auto;
  border-radius:50%;
  background:radial-gradient(circle at 50% 50%, #241C1580 0%, #1A140F80 70%, transparent 71%);
  border:1px solid var(--edge);
  touch-action:none;
}
#stick::before,#stick::after{content:"";position:absolute;background:var(--edge)}
#stick::before{left:10%;right:10%;top:calc(50% - 1px);height:1px}
#stick::after{top:10%;bottom:10%;left:calc(50% - 1px);width:1px}
#knob{
  position:absolute;width:48px;height:48px;left:38px;top:38px;
  border-radius:50%;
  background:#3A2C20;border:2px solid var(--muted);
  box-shadow:0 2px 0 #0007;
  transition:transform .06s linear;
}
#stick .up{
  position:absolute;top:6px;left:50%;transform:translateX(-50%);
  font-family:"Pixelify Sans","Manrope",sans-serif;
  font-size:9px;color:var(--moss);letter-spacing:.06em;pointer-events:none;
}
.abtn{
  width:84px;height:60px;
  font-family:"Pixelify Sans","Manrope",sans-serif;font-size:14px;
  color:var(--gold);background:#2A2018;
  border:1px solid var(--edge);border-bottom-width:3px;
  cursor:pointer;touch-action:none;
}
.abtn.down{background:#3A2C20;border-bottom-width:1px;transform:translateY(2px)}
.abtn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.taphint{
  flex:1;align-self:center;text-align:center;
  font-size:12px;color:var(--muted);line-height:1.4;
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="app">

<script>
const TILE = 32, VIEW_W = 7;
const cv = document.getElementById('screen');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

const el = {
  coins: document.getElementById('v-coins'),
  load: document.getElementById('v-load'),
  dollars: document.getElementById('v-dollars'),
  depthBox: document.getElementById('depth'),
  depthN: document.getElementById('v-depth'),
  hp: document.getElementById('b-hp'),
  food: document.getElementById('b-food'),
  rest: document.getElementById('b-rest'),
  toolIcon: document.getElementById('tool-icon'),
  toolName: document.getElementById('tool-name'),
  toast: document.getElementById('toast'),
  stage: document.getElementById('stage'),
  stick: document.getElementById('stick'),
  knob: document.getElementById('knob'),
  taphint: document.getElementById('taphint'),
  mode: document.getElementById('mode'),
  dig: document.getElementById('b-dig'),
  gPack: document.getElementById('g-pack'),
  gJet: document.getElementById('g-jet'),
};

let W = null, sprites = {}, charSprites = {};
let viewH = 15;

/* ── физика ──
   Подобрано так, чтобы прыжок поднимал ровно на 2 клетки (потолок по ГДД,
   пока нет ранца) и чтобы полёт занимал около секунды: раньше персонаж
   проваливался по клетке за кадр, и ни повернуть, ни разглядеть это было
   невозможно. */
const G = 16;          // клеток/с²
const JUMP_V = 8.1;    // с учётом зависания даёт ровно 2.2 клетки подъёма
const APEX_V = 2.0;    // |vy| ниже этого порога — зона зависания
const APEX_G = 0.45;   // насколько слабее тяготение в этой зоне
const WALK = 4.2;      // клеток/с по земле
const AIR_CTRL = 0.82; // насколько слушается руля в воздухе
// Предел скорости падения. Достигается примерно с 16 клетки, поэтому
// короткие падения он не трогает — их задаёт только G. Занижать нельзя:
// урон считается от скорости удара, и низкий потолок обрезал бы его.
const V_TERM = 32;
const HW = 0.38, HH = 0.46;

// Снаряжение открывается по глубине (ГДД раздел 5)
const PROP_DEPTH = 10, JET_DEPTH = 100, DRILL_DEPTH = 100;
const PROP_SPEED = 2.5, PROP_RAMP = 3;
const JET_SPEED = 20, JET_RAMP = 5;
// Пока герой ещё падает, тяга работает тормозом и гасит скорость намного
// резче, чем потом разгоняет вверх. Без этого подъёмная сила ранца
// (2/3 ≈ 0.7 кл/с²) не могла перебить тяготение в 16 кл/с²: нажатие вверх
// в падении выглядело так, будто ранец вообще не включился.
const THRUST_BRAKE = 26;
// Отпустил тягу на подъёме — инерция гасится в разы резче, чем тянет
// тяготение. Иначе джетпак на 20 кл/с уносит вверх ещё на десяток клеток
// после того, как палец уже снят.
const COAST_DECEL = G * 6;

// Урон считается от СКОРОСТИ удара, а не от высоты: спуск на пропеллере
// с семи клеток — это не падение с семи клеток, хотя высота та же.
// Коэффициенты выведены из опорных точек ГДД так, что свободное падение
// даёт ровно прежние числа: 5 клеток = 5 HP, 20 клеток = 100 HP.
const FALL_POW = 2.16 * 2;
const FALL_K = 0.154 / Math.pow(2 * G, 2.16);
const SAFE_SPEED = Math.sqrt(2 * G * 5);   // скорость, набираемая за 5 клеток
const DRILL_MULT = 0.45;   // ручной бур заметно быстрее кирки
// Физические углы тайлов слегка «скруглены»: если персонаж цепляется за угол
// меньше чем на столько, его обводит мимо, а не останавливает. Визуально
// тайлы не меняются — это только коллизии.
const CORNER = 5 / 32;

const MAX_KG = 60;
const DEMO_SPEED = 4;
const STUN_MS = 3000;

const S = {
  x: 20.5, y: 0.5,
  vx: 0, vy: 0,
  onGround: false,
  tool: 'shovel',
  coins: 0, dollars: 0, loadKg: 0,
  hp: 100, food: 100, rest: 100,
  maxDepth: 0,
  digging: null,
  stunUntil: 0,
  hold: { dx: 0, up: false, down: false },
  target: null,
  mode: 'stick',
  reliefR: 2, resR: 1,
  facing: 1,
  anim: 0,
  seenFoundation: false,
  gear: { backpack: false, jetpack: false, drill: false },
  thrust: null,
  coasting: false,
  fogRelief: new Set(),
  fogRes: new Set(),
  lastCell: '',
};

const cellX = () => Math.floor(S.x);
const cellY = () => Math.floor(S.y);

function key(x, y){ return y * W.width + x; }
function tileAt(x, y){
  if (y <= 0) return 'EMPTY';
  if (x < 0 || x >= W.width || y > W.depth) return 'BEDROCK';
  return W.tile_names[W.grid[(y - 1) * W.width + x]];
}
function setTile(x, y, name){
  if (y <= 0 || y > W.depth) return;
  W.grid[(y - 1) * W.width + x] = W.tile_names.indexOf(name);
}
const NOT_LOOT = new Set(['DIRT', 'STONE', 'FOUNDATION', 'STAIRCASE', 'EMPTY']);
const LOOT = { has: n => !NOT_LOOT.has(n) };

function meta(name){ return W.meta[name] || { name, price: 0, weight: 0, secs: 4 }; }
function solid(name){ return name !== 'EMPTY' && name !== 'BEDROCK'; }
function solidPt(wx, wy){ return solid(tileAt(Math.floor(wx), Math.floor(wy))); }
function canDig(name){
  if (name === 'STAIRCASE' || name === 'BEDROCK') return false;
  const p = W.tile_props[String(W.tile_names.indexOf(name))];
  if (!p) return false;
  return S.tool === 'shovel' ? p.shovel : (p.pickaxe || p.shovel);
}
function toast(html, ms = 2600){
  el.toast.innerHTML = html;
  el.toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.toast.classList.remove('show'), ms);
}

// Доля площади клетки, накрытая кругом обзора. Считается пробами по сетке:
// точная формула пересечения круга и квадрата тут не нужна, а 16 проб дают
// погрешность заметно меньше половины клетки — порога раскрытия.
function coverage(cx, cy, radius){
  const N = 4, r2 = radius * radius;
  let inside = 0;
  for (let i = 0; i < N; i++){
    const sy = cy + (i + 0.5) / N - S.y;
    for (let j = 0; j < N; j++){
      const sx = cx + (j + 0.5) / N - S.x;
      if (sx * sx + sy * sy <= r2) inside++;
    }
  }
  return inside / (N * N);
}

// Клетка раскрывается, когда круг накрывает её не меньше чем наполовину.
// По расстоянию между центрами диагональные клетки отсекались, хотя круг
// заметно на них заходил — и в них было видно пустоту там, где рельеф
// нарисован.
function reveal(){
  const rRelief = S.reliefR + 0.5, rRes = S.resR + 0.5;
  const span = Math.ceil(rRelief);
  const cx = cellX(), cy = cellY();
  for (let dy = -span; dy <= span; dy++)
    for (let dx = -span; dx <= span; dx++){
      const x = cx + dx, y = cy + dy;
      if (x < 0 || x >= W.width || y < 0) continue;
      if (coverage(x, y, rRelief) < 0.5) continue;
      S.fogRelief.add(key(x, y));
      if (coverage(x, y, rRes) >= 0.5) S.fogRes.add(key(x, y));
    }
}

/* ── столкновения ── */
function moveX(dt){
  if (S.vx === 0) return;
  S.x += S.vx * dt;
  const top = S.y - HH + 0.02, bot = S.y + HH - 0.02;
  const probe = S.vx > 0 ? S.x + HW : S.x - HW;
  const hitT = solidPt(probe, top), hitB = solidPt(probe, bot);
  let slipped = false;

  if (hitT && !hitB){
    const over = (Math.floor(top) + 1) - top;
    if (over <= CORNER){ S.y += over + 0.002; slipped = true; }
  } else if (hitB && !hitT){
    const over = bot - Math.floor(bot);
    if (over <= CORNER){ S.y -= over + 0.002; slipped = true; }
  }

  if (!slipped && (hitT || hitB)){
    S.x = S.vx > 0 ? Math.floor(probe) - HW - 0.001 : Math.floor(probe) + 1 + HW + 0.001;
    S.vx = 0;
  }
  S.x = Math.min(Math.max(S.x, HW), W.width - HW);
}


// Возле вершины прыжка и в момент смены знака скорости тяготение
// ослабляется: скорость набирается и гасится по параболе, и без этой паузы
// верхняя точка проскакивается мгновенно. Тем же местом потом гасится
// падение при включении пропеллеров.
function gravityNow(){
  return Math.abs(S.vy) < APEX_V ? G * APEX_G : G;
}

// Разгон ранца падает с грузом (ГДД: 3 / 0.85^(груз/20) секунд),
// потолок скорости при этом не меняется.
function propRamp(){ return PROP_RAMP / Math.pow(0.85, S.loadKg / 20); }

function moveY(dt){
  if (S.thrust){
    const jet = S.thrust === 'jet';
    const maxUp = jet ? JET_SPEED : PROP_SPEED;
    const ramp = jet ? JET_RAMP : propRamp();
    const accel = S.vy > 0 ? THRUST_BRAKE : maxUp / ramp;
    S.vy = Math.max(S.vy - accel * dt, -maxUp);
  } else {
    const g = (S.coasting && S.vy < 0) ? COAST_DECEL : gravityNow();
    S.vy = Math.min(S.vy + g * dt, V_TERM);
  }
  S.y += S.vy * dt;
  const left = S.x - HW + 0.02, right = S.x + HW - 0.02;
  S.onGround = false;

  if (S.vy > 0){
    const b = S.y + HH;
    const hitL = solidPt(left, b), hitR = solidPt(right, b);
    if (hitL || hitR){
      S.y = Math.floor(b) - HH - 0.001;
      land();
      S.vy = 0;
      S.onGround = true;
    }
  } else if (S.vy < 0){
    const tp = S.y - HH;
    const hitL = solidPt(left, tp), hitR = solidPt(right, tp);
    let slipped = false;
    // задет один угол потолка — обводим мимо, если зацеп мелкий
    if (hitL && !hitR){
      const over = (Math.floor(left) + 1) - left;
      if (over <= CORNER){ S.x += over + 0.002; slipped = true; }
    } else if (hitR && !hitL){
      const over = right - Math.floor(right);
      if (over <= CORNER){ S.x -= over + 0.002; slipped = true; }
    }
    if (!slipped && (hitL || hitR)){
      S.y = Math.floor(tp) + 1 + HH + 0.001;
      S.vy = 0;
    }
  }

  if (!S.onGround){
    const b = S.y + HH + 0.02;
    S.onGround = S.vy === 0 && (solidPt(left, b) || solidPt(right, b));
  }
}


function land(){
  const v = S.vy;
  if (v <= SAFE_SPEED) return;
  const dmg = Math.round(FALL_K * Math.pow(v, FALL_POW));
  if (dmg < 1) return;
  S.hp = Math.max(0, S.hp - dmg);
  toast(`Удар на скорости <b>${v.toFixed(1)}</b> кл/с — минус <b>${dmg}</b> HP`);
  if (S.hp === 0) die();
}

function updateFlight(){
  const was = S.thrust;
  if (!S.hold.up || S.onGround || S.digging) S.thrust = null;
  else if (S.gear.jetpack) S.thrust = 'jet';
  else S.thrust = S.gear.backpack ? 'prop' : null;

  if (was && !S.thrust && S.vy < 0) S.coasting = true;
  if (S.thrust || S.vy >= 0 || S.onGround) S.coasting = false;
}

function checkUnlocks(){
  // По текущей клетке открывать нельзя: достаточно на кадр подпрыгнуть или
  // соскользнуть выше порога, и момент теряется. Считаем по самой глубокой
  // точке, где герой вообще побывал.
  S.maxDepth = Math.max(S.maxDepth, cellY());
  const d = S.maxDepth;
  if (d >= PROP_DEPTH && !S.gear.backpack){
    S.gear.backpack = true;
    syncGear();
    toast('Глубина 10. Пригодился <b>ранец с пропеллерами</b> — держи стик вверх в воздухе: сначала погасит падение, потом поднимет.', 5200);
  }
  if (d >= JET_DEPTH && !S.gear.jetpack){
    S.gear.jetpack = true;
    S.gear.drill = true;
    S.tool = 'drill';
    el.toolIcon.src = 'art/items/hand_drill.png';
    el.toolName.textContent = 'Ручной бур';
    syncGear();
    toast('Глубина 100. Собраны <b>джетпак</b> и <b>ручной бур</b> — летишь без остановки и буришь вдвое быстрее.', 5200);
  }
}

function syncGear(){
  el.gPack.style.opacity = S.gear.backpack ? '1' : '.22';
  el.gJet.style.opacity = S.gear.jetpack ? '1' : '.22';
}

function jump(){
  if (!S.onGround || S.digging) return;
  if (performance.now() < S.stunUntil) return;
  if (solidPt(S.x, S.y - HH - 0.1)){ toast('Над головой порода — не подпрыгнуть.'); return; }
  S.vy = -JUMP_V;
  S.onGround = false;
}

// Верхний слой земли зарастает: иначе игрок, погибший под своей же шахтой,
// возрождается прямо над дырой и падает насмерть снова и снова.
function restoreTopSoil(){
  for (let x = 0; x < W.width; x++) W.grid[x] = W.pristine[x];
}

function die(){
  const lost = S.loadKg;
  restoreTopSoil();
  S.loadKg = 0;
  S.hp = S.food = S.rest = 100;
  S.x = 20.5; S.y = 0.5; S.vx = S.vy = 0;
  S.target = null; S.digging = null;
  toast(`Ты погиб. Минералы потеряны (<b>${lost.toFixed(1)}</b> кг). В игре уцелел бы только чёрный ящик.`, 4200);
}

/* ── копка ── */
function startDig(x, y){
  const name = tileAt(x, y);
  if (!solid(name)) return;
  if (S.digging && S.digging.x === x && S.digging.y === y) return;

  if (name === 'STAIRCASE'){ toast('Ступени не копаются — это путь наверх, пока нет ранца.'); return; }
  if (S.tool === 'shovel' && name === 'FOUNDATION'){
    if (!S.seenFoundation){
      S.seenFoundation = true;
      toast('Лопата упёрлась в старый фундамент. Нужно что-то покрепче — <b>в мастерскую!</b>', 3800);
      setTimeout(givePickaxe, 1400);
    }
    return;
  }
  if (S.tool === 'shovel' && y > 4){ toast('Лопатой глубже четвёртой клетки не достать.'); return; }
  if (!canDig(name)){
    S.stunUntil = performance.now() + STUN_MS;
    S.digging = null; S.target = null;
    toast(`Лопата звенит о <b>${meta(name).name.toLowerCase()}</b>. Буз-эффект — руки трясутся.`);
    return;
  }
  const mult = S.tool === 'drill' ? DRILL_MULT : 1;
  S.digging = { x, y, t: 0, total: meta(name).secs * mult / DEMO_SPEED, name };
}

function finishDig(){
  const d = S.digging;
  S.digging = null;
  const m = meta(d.name);
  setTile(d.x, d.y, 'EMPTY');
  S.fogRes.add(key(d.x, d.y));
  // Земля, камень и фундамент — не добыча: за них просто капают монеты,
  // в рюкзак они не ложатся и вес не занимают.
  if (!LOOT.has(d.name)){
    S.coins += m.price;
  } else if (S.loadKg + m.weight > MAX_KG){
    toast(`Рюкзак полон — <b>${m.name.toLowerCase()}</b> пришлось оставить.`);
  } else {
    S.loadKg += m.weight;
    S.coins += m.price;
    if (m.price >= 100) toast(`<b>${m.name}!</b> +${m.price} монет`);
  }
  if (d.y > S.maxDepth){
    S.maxDepth = d.y;
    if (d.y === 80) toast('Алмаз замурован в камне. Дедова кирка трескается — <b>−25% скорости</b>.', 4000);
  }
}

function givePickaxe(){
  S.tool = 'pickaxe';
  el.toolIcon.src = 'art/items/pickaxe_rusty.png';
  el.toolName.textContent = 'Ржавая кирка дедушки';
  toast('В мастерской деда, среди швабр и грабель — <b>кирка</b>. Теперь берётся камень и руда.', 4200);
}

/* ── намерение игрока ── */
function readTapIntent(){
  S.hold.dx = 0; S.hold.up = false; S.hold.down = false;
  if (!S.target) return;
  const cx = cellX(), cy = cellY();
  if (S.target.x === cx && S.target.y === cy){ S.target = null; return; }
  if (S.target.x !== cx) S.hold.dx = Math.sign(S.target.x - cx);
  else if (S.target.y > cy) S.hold.down = true;
  else if (S.target.y < cy) S.hold.up = true;
}

function applyIntent(dt){
  if (S.mode === 'tap') readTapIntent();

  if (S.digging){ S.vx = 0; return; }

  const speed = WALK * (S.onGround ? 1 : AIR_CTRL);
  S.vx = S.hold.dx * speed;
  if (S.hold.dx) S.facing = S.hold.dx;

  if (S.hold.up && S.onGround) jump();
  updateFlight();

  if (!S.onGround) return;

  const cx = cellX(), cy = cellY();
  if (S.hold.dx !== 0){
    // упёрся в породу на своём уровне — копаем её
    const ahead = tileAt(cx + S.hold.dx, cy);
    const edge = S.hold.dx > 0 ? (cx + 1) - (S.x + HW) : (S.x - HW) - cx;
    if (solid(ahead) && edge < 0.06) startDig(cx + S.hold.dx, cy);
  } else if (S.hold.down){
    const below = tileAt(cx, cy + 1);
    if (solid(below)) startDig(cx, cy + 1);
  }
}

/* ── отрисовка ── */
function camera(){
  return {
    x: Math.min(Math.max(S.x - VIEW_W / 2, 0), W.width - VIEW_W),
    y: Math.max(S.y - viewH / 2, -2),
  };
}

function drawTile(name, sx, sy, resKnown, wx, wy){
  if (!resKnown){
    ctx.fillStyle = solid(name) ? '#2C241B' : '#100D0A';
    ctx.fillRect(sx, sy, TILE, TILE);
    return;
  }
  if (name === 'BEDROCK'){ ctx.fillStyle = '#050403'; ctx.fillRect(sx, sy, TILE, TILE); return; }
  if (name === 'STAIRCASE'){
    ctx.fillStyle = '#6B5B45'; ctx.fillRect(sx, sy, TILE, TILE);
    ctx.fillStyle = '#8A7657'; ctx.fillRect(sx, sy, TILE, 5);
    return;
  }
  let file = W.art[name];
  if (name === 'DIRT'){
    // Вариант выбирается по МИРОВЫМ координатам клетки. По экранным он менялся
    // на каждый пиксель прокрутки, и земля рябила, будто тайлы вращаются.
    const h = ((wx * 73856093) ^ (wy * 19349663)) >>> 0;
    file = 'dirt_' + (1 + h % 4);
  }
  const img = sprites[file];
  if (img && img.complete && img.naturalWidth) ctx.drawImage(img, sx, sy);
  else { ctx.fillStyle = solid(name) ? '#4A3A2A' : '#0F0C09'; ctx.fillRect(sx, sy, TILE, TILE); }
}

function draw(){
  const cam = camera();
  const ox = Math.round((cam.x - Math.floor(cam.x)) * TILE);
  const oy = Math.round((cam.y - Math.floor(cam.y)) * TILE);
  const bx = Math.floor(cam.x), by = Math.floor(cam.y);

  ctx.fillStyle = '#0B0907';
  ctx.fillRect(0, 0, cv.width, cv.height);

  for (let r = -1; r <= viewH + 1; r++){
    const y = by + r, sy = r * TILE - oy;
    for (let c = -1; c <= VIEW_W + 1; c++){
      const x = bx + c, sx = c * TILE - ox;
      if (y < 0){ ctx.fillStyle = '#1D2A33'; ctx.fillRect(sx, sy, TILE, TILE); continue; }
      if (y === 0){
        ctx.fillStyle = '#3E5A2E'; ctx.fillRect(sx, sy, TILE, TILE);
        ctx.fillStyle = '#4E6E38'; ctx.fillRect(sx, sy, TILE, 6);
        continue;
      }
      const k = key(x, y);
      if (!S.fogRelief.has(k)){ ctx.fillStyle = '#080605'; ctx.fillRect(sx, sy, TILE, TILE); continue; }
      drawTile(tileAt(x, y), sx, sy, S.fogRes.has(k), x, y);
    }
  }

  const pcx = (S.x - cam.x) * TILE;
  const pcy = (S.y - cam.y) * TILE;

  ctx.save();
  ctx.globalAlpha = 0.16; ctx.strokeStyle = '#EADDC6'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(pcx, pcy, (S.reliefR + 0.5) * TILE, 0, 7); ctx.stroke();
  ctx.globalAlpha = 0.3; ctx.strokeStyle = '#E0A93B';
  ctx.beginPath(); ctx.arc(pcx, pcy, (S.resR + 0.5) * TILE, 0, 7); ctx.stroke();
  ctx.restore();

  if (S.digging){
    const dx = (S.digging.x - cam.x) * TILE, dy = (S.digging.y - cam.y) * TILE;
    ctx.fillStyle = '#00000070'; ctx.fillRect(dx, dy, TILE, TILE);
    ctx.fillStyle = '#E0A93B';
    ctx.fillRect(dx + 3, dy + TILE - 6, (TILE - 6) * (S.digging.t / S.digging.total), 3);
  }

  const sheet = S.digging ? (S.tool === 'shovel' ? 'dig_shovel' : 'dig_pick')
              : (!S.onGround ? (S.thrust ? 'fly' : 'fall') : (S.vx !== 0 ? 'walk' : 'idle'));
  const img = charSprites[sheet];
  const dx0 = Math.round(pcx - TILE / 2), dy0 = Math.round(pcy - HH * TILE - 16);
  if (img && img.complete && img.naturalWidth){
    const frames = Math.max(1, Math.round(img.naturalWidth / TILE));
    const f = frames > 1 ? Math.floor(S.anim / 7) % frames : 0;
    ctx.save();
    if (S.facing < 0){ ctx.translate(dx0 * 2 + TILE, 0); ctx.scale(-1, 1); }
    ctx.drawImage(img, f * TILE, 0, TILE, 48, dx0, dy0, TILE, 48);
    ctx.restore();
  } else {
    ctx.fillStyle = '#C9553F'; ctx.fillRect(dx0 + 8, dy0 + 18, 16, 26);
  }

  if (performance.now() < S.stunUntil){
    ctx.fillStyle = '#E0A93B';
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 60);
    ctx.fillRect(dx0 + 6, dy0 - 6, 20, 3);
    ctx.globalAlpha = 1;
  }

  placeDepth(cam);
}

function placeDepth(cam){
  const d = cellY();
  if (d <= 0){ el.depthBox.classList.remove('on'); return; }
  el.depthBox.classList.add('on');
  el.depthN.textContent = d;
  const scale = el.stage.clientHeight / cv.height;
  el.depthBox.style.top = (((S.y - cam.y) * TILE) * scale) + 'px';
}

function syncHud(){
  el.coins.textContent = S.coins.toLocaleString('ru-RU');
  el.dollars.textContent = S.dollars;
  el.load.textContent = `${S.loadKg.toFixed(1)} / ${MAX_KG} кг`;
  el.load.classList.toggle('over', S.loadKg > MAX_KG * 0.85);
  el.hp.style.width = S.hp + '%';
  el.food.style.width = S.food + '%';
  el.rest.style.width = S.rest + '%';
}

/* ── цикл ── */
let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;

  if (now < S.stunUntil){ S.vx = 0; }
  else applyIntent(dt);

  moveX(dt);
  moveY(dt);
  reveal();
  checkUnlocks();

  if (S.digging){
    S.digging.t += dt;
    S.anim += 2;
    if (S.digging.t >= S.digging.total) finishDig();
  } else if (S.vx !== 0) S.anim += 2;

  const drain = (S.digging ? 3 : 1) * dt * 0.35;
  S.food = Math.max(0, S.food - drain);
  S.rest = Math.max(0, S.rest - drain * 0.8);
  if (S.food === 0 || S.rest === 0){
    S.hp = Math.max(0, S.hp - dt * 4);
    if (S.hp === 0) die();
  }

  draw();
  syncHud();
  requestAnimationFrame(loop);
}

/* ── джойстик ── */
let stickId = null;
const DEAD = 0.3;
function stickVec(ev){
  const r = el.stick.getBoundingClientRect();
  let vx = (ev.clientX - r.left - r.width / 2) / (r.width / 2);
  let vy = (ev.clientY - r.top - r.height / 2) / (r.height / 2);
  const len = Math.hypot(vx, vy);
  if (len > 1){ vx /= len; vy /= len; }
  return { vx, vy };
}
function applyStick(v){
  el.knob.style.transform = `translate(${v.vx * 34}px, ${v.vy * 34}px)`;
  // оси читаются независимо: можно держать вбок и одновременно прыгнуть
  S.hold.dx = Math.abs(v.vx) > DEAD ? Math.sign(v.vx) : 0;
  S.hold.up = v.vy < -DEAD;
  S.hold.down = v.vy > DEAD && Math.abs(v.vx) <= DEAD;
  if (S.digging){
    const wrongSide = S.hold.dx && S.digging.x !== cellX() + S.hold.dx;
    const leftDown = !S.hold.down && S.digging.y === cellY() + 1;
    if (wrongSide || (leftDown && S.hold.dx)) S.digging = null;
  }
}
function releaseStick(){
  stickId = null;
  S.hold.dx = 0; S.hold.up = false; S.hold.down = false;
  el.knob.style.transform = '';
}
el.stick.addEventListener('pointerdown', e => {
  e.preventDefault();
  stickId = e.pointerId;
  el.stick.setPointerCapture(e.pointerId);
  applyStick(stickVec(e));
});
el.stick.addEventListener('pointermove', e => {
  if (e.pointerId === stickId) applyStick(stickVec(e));
});
for (const t of ['pointerup','pointercancel','lostpointercapture'])
  el.stick.addEventListener(t, e => { if (e.pointerId === stickId) releaseStick(); });

/* ── кнопка копать ── */
function digPress(e){
  e.preventDefault();
  el.dig.classList.add('down');
  const cx = cellX(), cy = cellY();
  if (S.hold.down) startDig(cx, cy + 1);
  else if (S.hold.dx !== 0) startDig(cx + S.hold.dx, cy);
  else startDig(cx + S.facing, cy);
}
el.dig.addEventListener('pointerdown', digPress);
for (const t of ['pointerup','pointercancel','pointerleave'])
  el.dig.addEventListener(t, () => el.dig.classList.remove('down'));

/* ── клавиатура для проверки с компьютера ── */
const K = {};
addEventListener('keydown', e => {
  if (['Space','ArrowUp','KeyW','ArrowLeft','KeyA','ArrowRight','KeyD','ArrowDown','KeyS'].includes(e.code)) e.preventDefault();
  K[e.code] = true; syncKeys();
});
addEventListener('keyup', e => { K[e.code] = false; syncKeys(); });
function syncKeys(){
  if (S.mode !== 'stick') return;
  const l = K.ArrowLeft || K.KeyA, r = K.ArrowRight || K.KeyD;
  S.hold.dx = (r ? 1 : 0) - (l ? 1 : 0);
  S.hold.up = !!(K.ArrowUp || K.KeyW || K.Space);
  S.hold.down = !!(K.ArrowDown || K.KeyS) && S.hold.dx === 0;
}

/* ── режим управления ── */
function setMode(m){
  S.mode = m;
  S.target = null;
  releaseStick();
  const stick = m === 'stick';
  el.mode.textContent = stick ? 'Джойстик' : 'Тап по клетке';
  el.mode.setAttribute('aria-pressed', String(stick));
  el.stick.style.display = stick ? '' : 'none';
  el.taphint.hidden = stick;
  el.dig.style.visibility = stick ? '' : 'hidden';
}
el.mode.addEventListener('click', () => setMode(S.mode === 'stick' ? 'tap' : 'stick'));

cv.addEventListener('pointerdown', ev => {
  if (S.mode !== 'tap') return;
  const r = cv.getBoundingClientRect();
  const cam = camera();
  const x = Math.floor(cam.x + (ev.clientX - r.left) / r.width * cv.width / TILE);
  const y = Math.floor(cam.y + (ev.clientY - r.top) / r.height * cv.height / TILE);
  if (x < 0 || x >= W.width) return;
  S.digging = null;
  S.target = { x, y };
});

document.getElementById('reset').addEventListener('click', () => {
  S.x = 20.5; S.y = 0.5; S.vx = S.vy = 0;
  S.coins = 0; S.loadKg = 0;
  S.hp = S.food = S.rest = 100;
  S.tool = 'shovel'; S.seenFoundation = false; S.maxDepth = 0;
  S.gear.backpack = S.gear.jetpack = S.gear.drill = false;
  S.thrust = null; S.coasting = false;
  syncGear();
  S.fogRelief.clear(); S.fogRes.clear(); S.lastCell = '';
  S.target = null; S.digging = null;
  if (W) W.grid.set(W.pristine);
  el.toolIcon.src = 'art/items/shovel.png';
  el.toolName.textContent = 'Лопата';
  reveal();
  toast('Бабка улетела в Таиланд. Огород твой.');
});

function resize(){
  viewH = Math.max(9, Math.min(19, Math.round(el.stage.clientHeight / (el.stage.clientWidth / VIEW_W))));
  cv.width = VIEW_W * TILE;
  cv.height = viewH * TILE;
  ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', resize);

const loadImg = src => { const i = new Image(); i.src = src; return i; };

fetch('world_dump.json').then(r => r.json()).then(data => {
  W = data;
  W.grid = Int16Array.from(W.grid);
  W.pristine = Int16Array.from(W.grid);
  for (const name of Object.keys(W.art)){
    const f = W.art[name];
    if (f) sprites[f] = loadImg(`art/tiles/${f}.png`);
  }
  for (let i = 1; i <= 4; i++) sprites['dirt_' + i] = loadImg(`art/tiles/dirt_${i}.png`);
  for (const a of ['idle','walk','fall','fly','dig_shovel','dig_pick'])
    charSprites[a] = loadImg(`art/character/${a}.png`);
  el.toolIcon.src = 'art/items/shovel.png';
  el.gPack.src = 'art/items/backpack_propeller.png';
  el.gJet.src = 'art/items/jetpack.png';
  syncGear();
  document.getElementById('i-coin').src = 'art/ui/icon_coin.png';
  document.getElementById('i-dollar').src = 'art/ui/icon_dollar.png';
  document.getElementById('i-inv').src = 'art/ui/icon_inventory.png';
  document.getElementById('i-hp').src = 'art/ui/icon_hp.png';
  document.getElementById('i-food').src = 'art/ui/icon_hunger.png';
  document.getElementById('i-rest').src = 'art/ui/icon_stamina.png';

  resize();
  setMode('stick');
  reveal();
  syncHud();
  toast('Бабка улетела в Таиланд. Огород твой — <b>копай</b>.', 3600);
  requestAnimationFrame(loop);
});
</script>
